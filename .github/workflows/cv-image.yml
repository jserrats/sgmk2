name: Build and publish the CV image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["cv/**", ".github/workflows/cv-image.yml"]
  pull_request:
    branches: [main]
    paths: ["cv/**", ".github/workflows/cv-image.yml"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ghcr.io/jserrats/sgmk2/cv. A new package rather than the old sgmk2-cv one, which is
  # linked to the old repo and wouldn't accept pushes from this one.
  IMAGE_NAME: ${{ github.repository }}/cv

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests build to prove the Dockerfile still works, but must not publish.
      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: cv
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The opencv layers are slow and rarely change; cache them between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
